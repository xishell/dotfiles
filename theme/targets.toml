# Template → output map for theme/gen. Paths are relative to the repo root.
#   comment  comment prefix for the "generated" header ("" = none, e.g. JSON; "/*" is closed)
#   region   true = only replace the block between `<comment> ember:begin` and
#            `<comment> ember:end` in an existing hand-maintained file

[[target]]
template = "hypr/palette.lua"
output   = "hypr/.config/hypr/modules/palette.lua"
comment  = "--"

[[target]]
template = "kitty/tab_bar.py"
output   = "kitty/.config/kitty/tab_bar.py"
comment  = "#"
region   = true

[[target]]
template = "kitty/ember.conf"
output   = "kitty/.config/kitty/ember.conf"
comment  = "#"

[[target]]
template = "kitty/session-picker.sh"
output   = "kitty/.config/kitty/scripts/session-picker.sh"
comment  = "#"
region   = true

[[target]]
template = "zsh/prompt.zsh"
output   = "zsh/.zshrc.d/11-prompt.zsh"
comment  = "#"

[[target]]
template = "nvim/ember.lua"
output   = "nvim/.config/nvim/lua/xishell/ember.lua"
comment  = "--"

[[target]]
template = "scripts/ember-bar.py"
output   = "scripts/.local/bin/ember-bar"
comment  = "#"
region   = true

[[target]]
template = "ironbar/config.toml"
output   = "ironbar/.config/ironbar/config.toml"
comment  = "#"

[[target]]
template = "ironbar/style.css"
output   = "ironbar/.config/ironbar/style.css"
comment  = "/*"

[[target]]
template = "walker/style.css"
output   = "walker/.config/walker/themes/ember/style.css"
comment  = "/*"

[[target]]
template = "walker/layout.xml"
output   = "walker/.config/walker/themes/ember/layout.xml"
comment  = ""

[[target]]
template = "walker/style.css"
output   = "walker/.config/walker/themes/ember-power/style.css"
comment  = "/*"

[[target]]
template = "walker/layout-power.xml"
output   = "walker/.config/walker/themes/ember-power/layout.xml"
comment  = ""

[[target]]
template = "mako/config"
output   = "mako/.config/mako/config"
comment  = "#"

[[target]]
template = "swayosd/style.css"
output   = "swayosd/.config/swayosd/style.css"
comment  = "/*"

[[target]]
template = "hypr/hyprlock.conf"
output   = "hypr/.config/hypr/hyprlock.conf"
comment  = "#"

# Cyberdream x Oxocarbon blend, single source of colour for the rice (see theme/README.md)

[meta]
name = "Oxocarbon"
variant = "dark"

# Oxocarbon ground warmed to Cyberdream accents, oxocarbon pink, calmer purple, blue focus
[colors]
crust     = "#0f1012" # wallpaper, lock bg, kitty tab strip, text on primary
base      = "#16181a" # window, bar, panel, terminal bg
surface   = "#2a2d33" # inactive border, hover, chips, tracks, dividers, text selection
selection = "#22252b" # current line, selected row
overlay   = "#3c4048" # subtle borders, line numbers, never text
comment   = "#7b8496" # hints, empty ws, code comments
fg_dim    = "#b6bac3" # labels, secondary text, operators
fg        = "#e2e4ea" # primary text, variables, cursor
primary   = "#6ba5ff" # focus solids: active ws, selection, mode block, couch chip, matches
orange    = "#ff7eb6" # pink: numbers, constants, gradient-border pink end
magenta   = "#b87af2" # purple: keywords, git branch, gradient-border cool end
red       = "#ff6e5e" # errors, urgent, critical, destructive, macros
urgent_bg = "#2e181b" # urgent ws bg, red tint on base
yellow    = "#f0d070" # warning, caps lock, cpu, attributes
green     = "#83c995" # success, prompt ok, strings, gpu (toned sage)
teal      = "#4bd3d9" # enum variants, constants, pad
cyan      = "#52e6ec" # types, mem
blue      = "#6ba5ff" # functions, dirs, links, net, verifying

# ANSI 16 normal 0-7 and bright 8-15, matches the approved kitty blend
[ansi]
color0  = "#16181a" # black
color1  = "#ff6e5e" # red
color2  = "#83c995" # green
color3  = "#f0d070" # yellow
color4  = "#6ba5ff" # blue
color5  = "#b87af2" # magenta
color6  = "#52e6ec" # cyan
color7  = "#e2e4ea" # white
color8  = "#7b8496" # bright black, autosuggestions and dim output
color9  = "#ff8575"
color10 = "#9ad4a8"
color11 = "#f5dc8a"
color12 = "#85b5ff"
color13 = "#ff7eb6"
color14 = "#6ef0f5"
color15 = "#ffffff"

# ember-gen refuses to write anything if an accent drops below these on `against`
[check]
against      = "base"
min_contrast = 4.5
min_chroma   = 20.0
accents      = ["primary", "orange", "magenta", "red", "yellow", "green", "teal", "cyan", "blue"]

# wallpaper shades for theme/wallpaper/gen.py, cool blend tuning with purple peak
[wallpaper]
sky_top = "#0f1012"
sky     = ["#16181a", "#191c22", "#201f2e", "#2a2442"]
sun_hi  = "#b87af2"
ridges  = ["#3c4048", "#2a2d33", "#22252b", "#16181a"]

# hyprlock: Hearth. Fingerprint (VeriMark via fprintd) or password.
# hyprlang treats # as a comment, so hex inside Pango markup is written ##rrggbb.
# Clock 192 px light with a primary (orchid) colon, date fg_dim, 400x56 pill input whose border
# shows the state: overlay, verifying blue, wrong red, caps yellow.

general {
    hide_cursor = true
    ignore_empty_input = true
}

auth {
    pam {
        enabled = true
    }
    fingerprint {
        enabled = true
        ready_message = touch the fingerprint reader
        present_message = checking
        retry_delay = 250
    }
}

background {
    monitor =
    color = {{ crust | hypr }}
}

# clock
label {
    monitor =
    text = cmd[update:1000] echo "$(date +%H)<span foreground='##{{ primary | bare }}'>:</span>$(date +%M)"
    font_family = FiraCode Nerd Font Light
    font_size = 144
    color = {{ fg | hypr }}
    position = 0, 160
    halign = center
    valign = center
}

# date
label {
    monitor =
    text = cmd[update:60000] LC_TIME=en_US.UTF-8 date +'%A %-d %B' | tr '[:upper:]' '[:lower:]'
    font_family = FiraCode Nerd Font
    font_size = 21
    color = {{ fg_dim | hypr }}
    position = 0, 30
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 400, 56
    rounding = -1
    outline_thickness = 1
    dots_size = 0.2
    dots_spacing = 0.6
    dots_center = true
    outer_color = {{ overlay | hypr }}   # idle; typing shows as dots (hyprlock has no typing colour)
    inner_color = {{ base | hypr }}
    font_color = {{ fg | hypr }}
    font_family = FiraCode Nerd Font
    fade_on_empty = false
    placeholder_text = <span foreground="##{{ comment | bare }}">password</span>
    check_color = {{ blue | hypr }}
    fail_color = {{ red | hypr }}
    fail_text = <span foreground="##{{ red | bare }}">wrong password</span>
    capslock_color = {{ yellow | hypr }}
    position = 0, -80
    halign = center
    valign = center
}

# fingerprint status, then the user
label {
    monitor =
    text = $FPRINTPROMPT
    font_family = FiraCode Nerd Font
    font_size = 11
    color = {{ fg_dim | hypr }}
    position = 0, -128
    halign = center
    valign = center
}

label {
    monitor =
    text = $USER
    font_family = FiraCode Nerd Font
    font_size = 15
    color = {{ comment | hypr }}
    position = 0, -172
    halign = center
    valign = center
}

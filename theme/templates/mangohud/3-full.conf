# MangoHud layout "full" (cycled by `hud` / Super+F10, which points MangoHud.conf here)
control=mangohud
position=top-left
round_corners=10
font_size=22
background_alpha=0.85
table_columns=3
fps
frametime
frame_timing
gpu_stats
gpu_temp
gpu_core_clock
gpu_power
cpu_stats
cpu_temp
vram
ram
resolution
refresh_rate
hdr
vulkan_driver
engine_version
wine

# Hearth: labels keep the bar's colours (cpu yellow, gpu green, mem cyan)
background_color={{ crust | bare }}
text_color={{ fg | bare }}
gpu_color={{ green | bare }}
cpu_color={{ yellow | bare }}
vram_color={{ cyan | bare }}
ram_color={{ cyan | bare }}
engine_color={{ magenta | bare }}
frametime_color={{ orange | bare }}
fps_color_change
fps_color={{ red | bare }},{{ yellow | bare }},{{ green | bare }}
fps_value=30,60

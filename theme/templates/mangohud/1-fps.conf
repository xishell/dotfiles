# MangoHud layout "fps" (cycled by `hud` / Super+F10, which copies it into MangoHud.conf)
control=mangohud
position=top-left
round_corners=10
fps_only
font_size=24
# white number, dark outline, no box: MangoHud sizes the fps_only box for four digits,
# so a three-digit number can't be centered in it
background_alpha=0
text_outline_thickness=2

# Hearth: labels keep the bar's colours (cpu yellow, gpu green, mem cyan)
background_color={{ crust | bare }}
text_color={{ fg | bare }}
gpu_color={{ green | bare }}
cpu_color={{ yellow | bare }}
vram_color={{ cyan | bare }}
ram_color={{ cyan | bare }}
engine_color={{ magenta | bare }}
frametime_color={{ orange | bare }}

# MangoHud (games launched with `mangohud %command%`). Starts hidden; Super+F10 shows or
# hides it through mangohudctl over the control socket below.
no_display
control=mangohud
position=top-left
round_corners=10
background_alpha=0.85
font_size=22
table_columns=3

fps
frametime
frame_timing
gpu_stats
gpu_temp
cpu_stats
cpu_temp
vram
ram
vulkan_driver
hdr
refresh_rate

# Ember: labels keep the bar's colours (cpu yellow, gpu green, mem cyan)
background_color={{ crust | bare }}
text_color={{ fg | bare }}
gpu_color={{ green | bare }}
cpu_color={{ yellow | bare }}
vram_color={{ cyan | bare }}
ram_color={{ cyan | bare }}
engine_color={{ magenta | bare }}
frametime_color={{ orange | bare }}
fps_color_change
fps_color={{ red | bare }},{{ yellow | bare }},{{ green | bare }}
fps_value=30,60

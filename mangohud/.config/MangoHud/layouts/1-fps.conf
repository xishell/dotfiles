# generated by theme/gen from theme/palette.toml (template: theme/templates/mangohud/1-fps.conf); edit those, not this
# MangoHud layout "fps" (cycled by `hud` / Super+F10, which copies it into MangoHud.conf)
control=mangohud
position=top-left
round_corners=10
fps_only
font_size=24
# white number, dark outline, no box: MangoHud sizes the fps_only box for four digits,
# so a three-digit number can't be centered in it
background_alpha=0
text_outline_thickness=2

# Hearth: labels keep the bar's colours (cpu yellow, gpu green, mem cyan)
background_color=0f1012
text_color=e2e4ea
gpu_color=83c995
cpu_color=f0d070
vram_color=52e6ec
ram_color=52e6ec
engine_color=b87af2
frametime_color=ff7eb6

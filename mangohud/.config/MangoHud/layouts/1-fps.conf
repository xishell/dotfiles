text_color=eceaf2
gpu_color=9ee05f
cpu_color=f5c84f
vram_color=52cfec
ram_color=52cfec
engine_color=cf8cf2
frametime_color=ff9a4f
fps_color_change
fps_color=ff6f88,f5c84f,9ee05f
fps_value=30,60

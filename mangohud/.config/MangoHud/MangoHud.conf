# generated by theme/gen from theme/palette.toml (template: theme/templates/mangohud/MangoHud.conf); edit those, not this
# MangoHud (games launched with `mangohud %command%`). Starts hidden; Super+F10 shows or
# hides it through mangohudctl over the control socket below.
no_display
control=mangohud
position=top-left
round_corners=10
background_alpha=0.85
font_size=22
table_columns=3

fps
frametime
frame_timing
gpu_stats
gpu_temp
cpu_stats
cpu_temp
vram
ram
vulkan_driver
hdr
refresh_rate

# Ember: labels keep the bar's colours (cpu yellow, gpu green, mem cyan)
background_color=141217
text_color=ddd3d6
gpu_color=a7c97a
cpu_color=e6b673
vram_color=86c9e0
ram_color=86c9e0
engine_color=c49ae8
frametime_color=ff9e64
fps_color_change
fps_color=f2798c,e6b673,a7c97a
fps_value=30,60

# Super+Space app launcher; also the dmenu backend for ~/.local/bin/menu-tools (Super+X).
# Tokyo Night palette to match waybar / the old otter-launcher theme.

[main]
font=SF Pro Text:size=12,FiraCode Nerd Font:size=12
prompt="❯  "
placeholder=type and search
icon-theme=Adwaita
icons-enabled=yes
terminal=kitty -e
layer=overlay
exit-on-keyboard-focus-loss=yes
width=42
lines=12
horizontal-pad=20
vertical-pad=14
inner-pad=10
line-height=26
fields=filename,name,generic,keywords

[colors]
background=1a1b26f2
text=a9b1d6ff
prompt=7aa2f7ff
placeholder=414868ff
input=c0caf5ff
match=e0af68ff
selection=283457ff
selection-text=c0caf5ff
selection-match=e0af68ff
border=7aa2f7ff

[border]
width=2
radius=10

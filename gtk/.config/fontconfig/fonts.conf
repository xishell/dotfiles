<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!-- ClearType-like rendering for the LG 34GN850 (Nano-IPS, RGB stripe, ~110 PPI):
       subpixel RGB AA + slight hinting everywhere. Keep in sync with gsettings and
       gtk-3.0/gtk-4.0 settings.ini, which GTK reads instead of this file. -->
  <match target="font">
    <edit name="antialias"      mode="assign"><bool>true</bool></edit>
    <edit name="hinting"        mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle"      mode="assign"><const>hintslight</const></edit>
    <edit name="rgba"           mode="assign"><const>rgb</const></edit>
    <edit name="lcdfilter"      mode="assign"><const>lcddefault</const></edit>
    <edit name="embeddedbitmap" mode="assign"><bool>false</bool></edit>
  </match>

  <!-- Default family resolutions.
       SF Pro Text, not Display: Display is cut for >=20pt and looks thin and
       loosely spaced at UI sizes on a low-DPI screen. -->
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>SF Pro Text</family>
      <family>Inter</family>
    </prefer>
  </alias>
  <alias>
    <family>serif</family>
    <prefer>
      <family>New York</family>
      <family>Noto Serif</family>
    </prefer>
  </alias>
  <alias>
    <family>monospace</family>
    <prefer>
      <family>FiraCode Nerd Font Mono</family>
      <family>Fira Code</family>
    </prefer>
  </alias>
  <alias>
    <family>system-ui</family>
    <prefer>
      <family>SF Pro Text</family>
    </prefer>
  </alias>

  <!-- Apple font names that websites ask for (GitHub: -apple-system, BlinkMacSystemFont,
       "Segoe UI", "Noto Sans", …). They only exist on macOS, so Linux browsers skip to
       the next entry; pointing them at the installed SF fonts makes pages render as
       they do on the Mac. Firefox/Zen use these substitutes for missing named families. -->
  <alias>
    <family>-apple-system</family>
    <prefer><family>SF Pro Text</family></prefer>
  </alias>
  <alias>
    <family>BlinkMacSystemFont</family>
    <prefer><family>SF Pro Text</family></prefer>
  </alias>
  <alias>
    <family>ui-sans-serif</family>
    <prefer><family>SF Pro Text</family></prefer>
  </alias>
  <alias>
    <family>Helvetica Neue</family>
    <prefer><family>SF Pro Text</family></prefer>
  </alias>
  <alias>
    <family>Helvetica</family>
    <prefer><family>SF Pro Text</family></prefer>
  </alias>
  <alias>
    <family>ui-monospace</family>
    <prefer><family>SFMono Nerd Font Mono</family></prefer>
  </alias>
  <alias>
    <family>SFMono-Regular</family>
    <prefer><family>SFMono Nerd Font Mono</family></prefer>
  </alias>
  <alias>
    <family>SF Mono</family>
    <prefer><family>SFMono Nerd Font Mono</family></prefer>
  </alias>
  <alias>
    <family>Menlo</family>
    <prefer><family>SFMono Nerd Font Mono</family></prefer>
  </alias>
  <alias>
    <family>Monaco</family>
    <prefer><family>SFMono Nerd Font Mono</family></prefer>
  </alias>
</fontconfig>

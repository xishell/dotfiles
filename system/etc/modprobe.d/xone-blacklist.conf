# Keep xpad off Xbox-protocol pads so xone owns them (needed for the 8BitDo
# Ultimate 3 headset jack). This file overrides /usr/lib/modprobe.d/xone-blacklist.conf.
# "blacklist" alone is not enough: xpad still got loaded on device add and raced
# xone for the controller, so forbid loading it at all. (Breaks Xbox 360 pads.)
blacklist xpad
install xpad /bin/false
blacklist mt76x2u

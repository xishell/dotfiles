# walker (Super+Space). Overrides only; everything else is walker's default.
# Results come from elephant (systemd user service); menus live in ~/.config/elephant/menus.
theme = "ember"
force_keyboard_focus = true
selection_wrap = true
hide_action_hints = true      # the theme's footer shows the prefixes instead
click_to_close = true

[providers]
default = ["desktopapplications", "calc", "menus:actions"]
empty   = ["desktopapplications"]
max_results = 30

# Footer hints in the theme list these: = calc · > run · : emoji · ! power
[[providers.prefixes]]
prefix = "="
provider = "calc"

[[providers.prefixes]]
prefix = ">"
provider = "runner"

[[providers.prefixes]]
prefix = ":"
provider = "symbols"

[[providers.prefixes]]
prefix = "!"
provider = "menus:power"

[keybinds]
quick_activate = ["F1", "F2", "F3", "F4", "F5", "F6"]

[placeholders]
"default"     = { input = "apps", list = "no results" }
"menus:power" = { input = "power", list = "" }
"clipboard"   = { input = "clipboard", list = "history is empty" }

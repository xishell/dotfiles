# The Wave XLR exposes its preamp gain as the ALSA capture control "Mic"
# (0-150 = 0-75 dB). WirePlumber restores the saved route volume (100%) to that
# control whenever the card profile is (re)activated -- e.g. by wave-xlr-recover
# at every login -- which slammed the gain to 75 dB. Use software volume so
# PipeWire never writes the hardware mixer; gain belongs to the unit's knob and
# OpenXLR. Applies in both audio-mode legacy and openxlr (not parked).
monitor.alsa.rules = [
  {
    matches = [
      { device.name = "~alsa_card.usb-Elgato_Systems_Elgato_Wave_XLR_*" }
    ]
    actions = {
      update-props = {
        api.alsa.soft-mixer = true
      }
    }
  }
]

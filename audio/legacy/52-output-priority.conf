# Output auto-switching, like Wave Link on Windows (the mic stays on the Wave):
# 8BitDo controller headset jack (via xone) wins when present, else the Wave XLR.
# Only works while no output default is pinned (wpctl clear-default); picking an
# output manually in a mixer pins it again.
monitor.alsa.rules = [
  {
    matches = [
      { node.name = "~alsa_output.usb-8BitDo_*" }
    ]
    actions = {
      update-props = {
        priority.session = 2000
        priority.driver  = 2000
      }
    }
  }
  {
    matches = [
      { node.name = "~alsa_output.usb-Elgato_Systems_Elgato_Wave_XLR_*" }
    ]
    actions = {
      update-props = {
        priority.session = 1500
        priority.driver  = 1500
      }
    }
  }
  # Mic always stays on the Wave XLR, never the controller headset mic.
  {
    matches = [
      { node.name = "~alsa_input.usb-Elgato_Systems_Elgato_Wave_XLR_*" }
    ]
    actions = {
      update-props = {
        priority.session = 2500
      }
    }
  }
  {
    matches = [
      { node.name = "~alsa_input.usb-8BitDo_*" }
    ]
    actions = {
      update-props = {
        priority.session = 100
      }
    }
  }
]

# Load the custom app routing hook and configure stream behavior

wireplumber.components = [
  {
    name = linking/find-user-target.lua
    type = script/lua
    provides = hooks.linking.target.find-user
  }
]

wireplumber.profiles = {
  main = {
    hooks.linking.target.find-user = required
  }
}

wireplumber.settings = {
  # Disable restoring stream targets from previous sessions.
  # Our find-user-target.lua handles all routing deterministically.
  # Volume/mute state is still preserved (restore-props remains true).
  node.stream.restore-target = false
}

# Wave Link-style virtual sinks
# Each loopback creates a virtual sink.
# Playback nodes follow the default output (Wave XLR, or the 8BitDo controller
# jack when headphones are in -- see wireplumber 52-output-priority.conf).
# find-user-target.lua skips *_loopback nodes. App routing is handled there.

context.modules = [
    # System - default sink for apps not matching any routing rule
    { name = libpipewire-module-loopback
        args = {
            node.description = "System"
            capture.props = {
                node.name        = "System"
                media.class      = Audio/Sink
                audio.position   = [ FL FR ]
            }
            playback.props = {
                node.name        = "system_loopback"
                node.passive     = true
                stream.dont-remix = true
                audio.position   = [ FL FR ]
            }
        }
    }

    # Games - Steam, Lutris, Wine/Proton games
    { name = libpipewire-module-loopback

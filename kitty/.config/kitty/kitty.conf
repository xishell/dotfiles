# --- Look and Feel ---
include tokyonight_night.conf
# font_family FiraCode Nerd Font
font_size 14.0
cursor_shape block
cursor_blink_interval 0

# Padding
window_padding_width 0 6

# Window chrome
hide_window_decorations titlebar-only
macos_option_as_alt left

# Mouse and interaction
mouse_hide_wait -1
copy_on_select yes
confirm_os_window_close 0

# --- sessions, replacing tmux ---
# sessions/*.kitty-session, one per project, switched with ctrl+a ctrl+j
startup_session sessions/main.kitty-session
enabled_layouts splits,stack
# tab bar shows only the active session's tabs, like a tmux session's windows
tab_bar_filter session:~ or session:^$
tab_bar_edge bottom
# drawn by tab_bar.py: session block, tabs, cwd on the right
tab_bar_style custom
tab_bar_min_tabs 1

# smart-splits.nvim and scripts/new-session.sh drive kitty over this socket
allow_remote_control socket-only
listen_on unix:/tmp/kitty-{kitty_pid}

# prefix ctrl+a, same keys as the old tmux.conf
map ctrl+a>ctrl+a send_key ctrl+a
map ctrl+a>r load_config_file
map ctrl+a>shift+l send_key ctrl+l

map ctrl+a>| launch --location=vsplit --cwd=current
map ctrl+a>- launch --location=hsplit --cwd=current
map ctrl+a>c new_tab_with_cwd
map cmd+t new_tab_with_cwd
map ctrl+a>z toggle_layout stack
map ctrl+a>x close_window
map ctrl+a>& close_tab
map ctrl+a>[ show_scrollback

map ctrl+a>h previous_tab
map ctrl+a>l next_tab
map ctrl+a>1 goto_tab 1
map ctrl+a>2 goto_tab 2
map ctrl+a>3 goto_tab 3
map ctrl+a>4 goto_tab 4
map ctrl+a>5 goto_tab 5
map ctrl+a>6 goto_tab 6
map ctrl+a>7 goto_tab 7
map ctrl+a>8 goto_tab 8
map ctrl+a>9 goto_tab 9

map ctrl+a>up resize_window taller 5
map ctrl+a>down resize_window shorter 5
map ctrl+a>left resize_window narrower 5
map ctrl+a>right resize_window wider 5

map ctrl+a>ctrl+j goto_session --active-only
map ctrl+a>ctrl+s goto_session ~/.config/kitty/sessions
map ctrl+a>ctrl+n launch --type=overlay --cwd=current sh -c '"$HOME"/.config/kitty/scripts/new-session.sh'
map ctrl+a>ctrl+o goto_session -1
map ctrl+a>shift+x close_session

# tmux popups become overlays over the current window
map ctrl+a>ctrl+y launch --type=overlay --cwd=current lazygit
map ctrl+a>ctrl+g launch --type=overlay --cwd=current gh dash
map ctrl+a>ctrl+t launch --type=overlay --cwd=current zsh
map ctrl+a>ctrl+p launch --type=overlay spotify_player

# ctrl+hjkl crosses kitty splits, passed through when nvim is focused
map ctrl+h neighboring_window left
map ctrl+j neighboring_window down
map ctrl+k neighboring_window up
map ctrl+l neighboring_window right
map --when-focus-on var:IS_NVIM ctrl+h
map --when-focus-on var:IS_NVIM ctrl+j
map --when-focus-on var:IS_NVIM ctrl+k
map --when-focus-on var:IS_NVIM ctrl+l


# BEGIN_KITTY_FONTS
font_family      family="Fira Code"
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS

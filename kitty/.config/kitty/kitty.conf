# --- Look and Feel ---
include tokyonight_night.conf
# font_family FiraCode Nerd Font
font_size 14.0
cursor_shape block
cursor_blink_interval 0

# Padding
window_padding_width 0 6

# Window chrome
hide_window_decorations titlebar-only
macos_option_as_alt left

# Mouse and interaction
mouse_hide_wait -1
copy_on_select yes
confirm_os_window_close 0

# --- sessions, replacing tmux ---
# sessions/*.kitty-session, one per project, switched with ctrl+a ctrl+j
startup_session sessions/main.kitty-session
enabled_layouts splits,stack
# tab bar shows only the active session's tabs, like a tmux session's windows
tab_bar_filter session:~ or session:^$
tab_bar_edge bottom
# drawn by tab_bar.py: session block, tabs, cwd on the right
tab_bar_style custom
tab_bar_min_tabs 1

# smart-splits.nvim and scripts/session-picker.sh drive kitty over this socket
allow_remote_control socket-only
listen_on unix:/tmp/kitty-{kitty_pid}

# prefix ctrl+a, same keys as the old tmux.conf
# a mode not a key sequence, so tab_bar.py can light the session icon while held
map --new-mode prefix --on-action end --on-unknown end ctrl+a
map --mode prefix esc pop_keyboard_mode
map --mode prefix ctrl+a send_key ctrl+a
map --mode prefix r load_config_file
map --mode prefix shift+l send_key ctrl+l

map --mode prefix | launch --location=vsplit --cwd=current
map --mode prefix - launch --location=hsplit --cwd=current
map --mode prefix c new_tab_with_cwd
map cmd+t new_tab_with_cwd
map --mode prefix z toggle_layout stack
map --mode prefix x close_window
map --mode prefix & close_tab
map --mode prefix [ show_scrollback

map --mode prefix h previous_tab
map --mode prefix l next_tab
map --mode prefix 1 goto_tab 1
map --mode prefix 2 goto_tab 2
map --mode prefix 3 goto_tab 3
map --mode prefix 4 goto_tab 4
map --mode prefix 5 goto_tab 5
map --mode prefix 6 goto_tab 6
map --mode prefix 7 goto_tab 7
map --mode prefix 8 goto_tab 8
map --mode prefix 9 goto_tab 9

map --mode prefix up resize_window taller 5
map --mode prefix down resize_window shorter 5
map --mode prefix left resize_window narrower 5
map --mode prefix right resize_window wider 5

# picker floats as a centred panel, own instance so it skips the tab bar
action_alias session_picker launch --type=background --cwd=current $HOME/.config/kitty/scripts/session-popup.sh
map --mode prefix ctrl+j session_picker @active-kitty-window-id switch
map --mode prefix ctrl+s session_picker @active-kitty-window-id switch
map --mode prefix ctrl+n session_picker @active-kitty-window-id new
map --mode prefix ctrl+o goto_session -1
map --mode prefix shift+x close_session

# tmux popups become overlays over the current window
map --mode prefix ctrl+y launch --type=overlay --cwd=current lazygit
map --mode prefix ctrl+g launch --type=overlay --cwd=current gh dash
map --mode prefix ctrl+t launch --type=overlay --cwd=current zsh
map --mode prefix ctrl+p launch --type=overlay spotify_player

# ctrl+hjkl crosses kitty splits, passed through when nvim is focused
map ctrl+h neighboring_window left
map ctrl+j neighboring_window down
map ctrl+k neighboring_window up
map ctrl+l neighboring_window right
map --when-focus-on var:IS_NVIM ctrl+h
map --when-focus-on var:IS_NVIM ctrl+j
map --when-focus-on var:IS_NVIM ctrl+k
map --when-focus-on var:IS_NVIM ctrl+l


# BEGIN_KITTY_FONTS
font_family      family="Fira Code"
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS

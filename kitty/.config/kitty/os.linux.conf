# Linux (Hyprland, 3440x1440 at scale 1): 12 pt (11 ≈ the 13 px UI size read too small).
# Nerd Font for the tab bar and prompt icons; ligatures stay on (kitty default).
font_family      family="FiraCode Nerd Font"
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12.0

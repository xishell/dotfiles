# NVIDIA GBM backend selection.
# These must live here (not only in hypr/modules/env.lua) so that
# systemd/D-Bus-activated user services -- notably
# xdg-desktop-portal-hyprland -- inherit them. Hyprland's env= only
# reaches Hyprland's own children, which left the portal allocating
# DMA-BUF via Mesa on the NVIDIA render node and failing screencast.
GBM_BACKEND=nvidia-drm
__GLX_VENDOR_LIBRARY_NAME=nvidia
LIBVA_DRIVER_NAME=nvidia

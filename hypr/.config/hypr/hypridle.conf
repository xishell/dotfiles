# Idle: lock at 5 min and turn the screens off right after it (1 s later, so the lock
# surface is up before the outputs go dark); lock before suspend.
# Fullscreen windows (games, Big Picture, video) inhibit idle via the window rule in
# windowrules.lua, so a controller session never locks or blanks.
# Apps that ask over D-Bus (a browser playing video, even windowed) also hold it off:
# hypridle owns org.freedesktop.ScreenSaver for that, and `journalctl --user -u hypridle`
# logs who inhibits if the session ever refuses to lock.
general {
    # lock-screen = hyprlock + a watcher that re-blanks a monitor that drops off the bus
    # in standby and comes back powered on (see ~/.local/bin/lock-screen).
    lock_cmd = pidof hyprlock || lock-screen
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms("on")'
    ignore_dbus_inhibit = false
    ignore_systemd_inhibit = false
}

# Screens go off 3 s after the lock is started (hyprlock takes ~2 s to lock), not via a
# separate 301 s timer: since Hyprland 0.57.2 / hyprlock 0.9.7 (2026-11-16), starting
# hyprlock registers as activity ~0.25 s in, which reset that timer and its on-resume
# turned the screens straight back on. Waking is Hyprland's job (misc.*_enables_dpms in
# look_and_feel.lua), so no on-resume dpms-on here: a fake resume can't light them up.
# (on_lock_cmd would be cleaner, but hypridle ignores it with hyprlock as locker.)
# Skipped when already locked: that same fake activity re-arms this rule, so it fired again
# 5 min into every lock, and the extra dpms-off on an already-dark LG is what knocked it
# off the bus (2026-11-17 22:17: off again at :19, output removed at :23, lit at :26).
listener {
    timeout = 300
    on-timeout = pidof hyprlock || { loginctl lock-session; sleep 3; pidof hyprlock && hyprctl dispatch 'hl.dsp.dpms("off")'; }
}

# While locked, blank again after 30 s idle (someone bumped the mouse while you're away).
# ignore_inhibit: nobody is watching a locked screen, so no inhibitor may keep it lit.
# Without it, an inhibitor that came up while locked (2026-11-17 12:39: blanked, "Resumed"
# 1 s later, then no Idled for 68 min) left the lock screen on until someone came back.
# Safe for games/video: the pidof hyprlock guard means it only acts while locked.
listener {
    timeout = 30
    ignore_inhibit = true
    on-timeout = pidof hyprlock && hyprctl dispatch 'hl.dsp.dpms("off")'
}

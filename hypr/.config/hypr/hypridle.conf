# Idle: lock at 5 min, screens off 10 s later; lock before suspend.
# Fullscreen windows (games, Big Picture, video) inhibit idle via the window rule in
# windowrules.lua, so a controller session never locks or blanks.
general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms("on")'
    ignore_dbus_inhibit = true
    ignore_systemd_inhibit = false
}

listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

listener {
    timeout = 310
    on-timeout = hyprctl dispatch 'hl.dsp.dpms("off")'
    on-resume = hyprctl dispatch 'hl.dsp.dpms("on")'
}

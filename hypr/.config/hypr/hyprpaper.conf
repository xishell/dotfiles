# Ember wallpaper per output (hyprpaper 0.8: one block per monitor, no preload).
# The PNGs are rendered from theme/palette.toml by theme/ember (theme/wallpaper/gen.py).
splash = false

wallpaper {
    monitor  = DP-1
    path     = ~/.config/hypr/wall/ember-tokyonight_3440x1440.png
    fit_mode = cover
}

wallpaper {
    monitor  = HDMI-A-1
    path     = ~/.config/hypr/wall/ember-tokyonight_3840x2160.png
    fit_mode = cover
}

# #######################################################################################
# HYPRLAND CONFIGURATION
# #######################################################################################
#
# This configuration is split into multiple files for easier modification.
# All configuration files are located in: ~/.config/hypr/conf.d/
#
# To modify specific settings, edit the corresponding file:
#   - env.conf           : Environment variables and permissions
#   - monitors.conf      : Monitor configuration
#   - look-and-feel.conf : Visual settings (general, decoration, animations, layouts)
#   - input.conf         : Keyboard, mouse, touchpad, and gesture settings
#   - keybinds.conf      : Keybindings and program shortcuts
#   - windowrules.conf   : Window rules and workspace rules
#   - autostart.conf     : Applications to launch on startup
#
# For more information, refer to the Hyprland wiki:
# https://wiki.hypr.land/Configuring/
#
# #######################################################################################

# Load environment variables first
source = ~/.config/hypr/conf.d/env.conf

# Load monitor configuration
source = ~/.config/hypr/conf.d/monitors.conf

# Load visual settings
source = ~/.config/hypr/conf.d/look-and-feel.conf

# Load input configuration
source = ~/.config/hypr/conf.d/input.conf

# Load keybindings
source = ~/.config/hypr/conf.d/keybinds.conf

# Load window rules
source = ~/.config/hypr/conf.d/windowrules.conf

# Load autostart applications (last, so everything is loaded before autostart)
source = ~/.config/hypr/conf.d/autostart.conf

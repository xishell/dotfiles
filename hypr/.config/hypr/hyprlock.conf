# generated by theme/gen from theme/palette.toml (template: theme/templates/hypr/hyprlock.conf); edit those, not this
# hyprlock: Tokyo Night Ember. Fingerprint (VeriMark via fprintd) or password.
# hyprlang treats # as a comment, so hex inside Pango markup is written ##rrggbb.
# Clock 192 px light with an orange colon, date fg_dim, 400x56 pill input whose border
# shows the state: overlay, verifying magenta, wrong red, caps yellow.

general {
    hide_cursor = true
    ignore_empty_input = true
}

auth {
    pam {
        enabled = true
    }
    fingerprint {
        enabled = true
        ready_message = touch the fingerprint reader
        present_message = checking
        retry_delay = 250
    }
}

background {
    monitor =
    color = rgb(141217)
}

# clock
label {
    monitor =
    text = cmd[update:1000] echo "$(date +%H)<span foreground='##ff9e64'>:</span>$(date +%M)"
    font_family = FiraCode Nerd Font Light
    font_size = 144
    color = rgb(ddd3d6)
    position = 0, 160
    halign = center
    valign = center
}

# date
label {
    monitor =
    text = cmd[update:60000] date +'%A %-d %B' | tr '[:upper:]' '[:lower:]'
    font_family = FiraCode Nerd Font
    font_size = 21
    color = rgb(b3a9b8)
    position = 0, 30
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 400, 56
    rounding = -1
    outline_thickness = 1
    dots_size = 0.2
    dots_spacing = 0.6
    dots_center = true
    outer_color = rgb(48404f)   # idle; typing shows as dots (hyprlock has no typing colour)
    inner_color = rgb(1a171d)
    font_color = rgb(ddd3d6)
    font_family = FiraCode Nerd Font
    fade_on_empty = false
    placeholder_text = <span foreground="##938a9b">password</span>
    check_color = rgb(c49ae8)
    fail_color = rgb(f2798c)
    fail_text = <span foreground="##f2798c">wrong password</span>
    capslock_color = rgb(e6b673)
    position = 0, -80
    halign = center
    valign = center
}

# fingerprint status, then the user
label {
    monitor =
    text = $FPRINTPROMPT
    font_family = FiraCode Nerd Font
    font_size = 11
    color = rgb(b3a9b8)
    position = 0, -134
    halign = center
    valign = center
}

label {
    monitor =
    text = $USER
    font_family = FiraCode Nerd Font
    font_size = 15
    color = rgb(938a9b)
    position = 0, -162
    halign = center
    valign = center
}

# generated by theme/gen from theme/palette.toml (template: theme/templates/hypr/hyprlock.conf); edit those, not this
# hyprlock: Hearth. Fingerprint (VeriMark via fprintd) or password.
# hyprlang treats # as a comment, so hex inside Pango markup is written ##rrggbb.
# Clock 192 px light with a primary (orchid) colon, date fg_dim, 400x56 pill input whose border
# shows the state: overlay, verifying blue, wrong red, caps yellow.

general {
    hide_cursor = true
    ignore_empty_input = true
}

auth {
    pam {
        enabled = true
    }
    fingerprint {
        enabled = true
        ready_message = touch the fingerprint reader
        present_message = checking
        retry_delay = 250
    }
}

background {
    monitor =
    color = rgb(0f1012)
}

# clock
label {
    monitor =
    text = cmd[update:1000] echo "$(date +%H)<span foreground='##6ba5ff'>:</span>$(date +%M)"
    font_family = FiraCode Nerd Font Light
    font_size = 144
    color = rgb(e2e4ea)
    position = 0, 160
    halign = center
    valign = center
}

# date
label {
    monitor =
    text = cmd[update:60000] LC_TIME=en_US.UTF-8 date +'%A %-d %B' | tr '[:upper:]' '[:lower:]'
    font_family = FiraCode Nerd Font
    font_size = 21
    color = rgb(b6bac3)
    position = 0, 30
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 400, 56
    rounding = -1
    outline_thickness = 1
    dots_size = 0.2
    dots_spacing = 0.6
    dots_center = true
    outer_color = rgb(3c4048)   # idle; typing shows as dots (hyprlock has no typing colour)
    inner_color = rgb(16181a)
    font_color = rgb(e2e4ea)
    font_family = FiraCode Nerd Font
    fade_on_empty = false
    placeholder_text = <span foreground="##7b8496">password</span>
    check_color = rgb(6ba5ff)
    fail_color = rgb(ff6e5e)
    fail_text = <span foreground="##ff6e5e">wrong password</span>
    capslock_color = rgb(f0d070)
    position = 0, -80
    halign = center
    valign = center
}

# fingerprint status, then the user
label {
    monitor =
    text = $FPRINTPROMPT
    font_family = FiraCode Nerd Font
    font_size = 11
    color = rgb(b6bac3)
    position = 0, -128
    halign = center
    valign = center
}

label {
    monitor =
    text = $USER
    font_family = FiraCode Nerd Font
    font_size = 15
    color = rgb(7b8496)
    position = 0, -172
    halign = center
    valign = center
}

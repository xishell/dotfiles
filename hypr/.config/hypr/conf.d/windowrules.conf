##############################
### WINDOWS AND WORKSPACES ###
##############################

# See https://wiki.hypr.land/Configuring/Window-Rules/ for more
# See https://wiki.hypr.land/Configuring/Workspace-Rules/ for workspace rules

# Otter launcher floating window
windowrule {
    name = float-otter-launcher
    match:class = ^otter-launcher$
    float = true
    size = 620 420
    center = true
    animation = popin
}

# Cheatsheet floating window
windowrule {
    name = float-cht
    match:class = ^cht-float$
    float = true
    size = 700 500
    center = true
    animation = popin
}

# Ignore maximize requests from all apps
windowrule {
    name = suppress-maximize
    match:class = .*
    suppress_event = maximize
}

# Fix some dragging issues with XWayland
windowrule {
    name = fix-xwayland-drag
    match:class = ^$
    match:title = ^$
    match:xwayland = true
    match:float = true
    match:fullscreen = false
    match:pin = false
    no_focus = true
}

# Float common dialogs and utilities
windowrule {
    name = float-file-dialogs
    match:title = ^(Open File|Save File|Select a File|Choose a file)$
    float = true
    size = 800 600
    center = true
}

windowrule {
    name = float-system-utils
    match:class = ^(pavucontrol|nm-connection-editor|blueman-manager)$
    float = true
    center = true
}

windowrule {
    name = float-calculators
    match:class = ^(org.gnome.Calculator|qalculate-gtk|galculator)$
    float = true
    center = true
}

# Picture-in-picture handling
windowrule {
    name = pip-window
    match:title = ^(Picture-in-Picture|Picture in picture)$
    float = true
    pin = true
    size = 640 360
    move = 100%-660 100%-390
}

# Yazi file manager (opened via xdg file picker)
windowrule {
    name = float-yazi
    match:class = ^yazi-fm$
    float = true
    size = 1200 800
    center = true
}

# Center Steam sub-windows that have a title (friends list, settings, etc.)
windowrule {
    name = float-steam-subwindows
    match:class = ^steam$
    match:title = .+
    float = true
    center = true
}

# Keep the main Steam window tiled
windowrule {
    name = tile-steam-main
    match:class = ^steam$
    match:title = ^Steam$
    tile = true
}

# Terminal opacity (adjust class to your terminal)
windowrule {
    name = terminal-opacity
    match:class = ^(Alacritty|kitty|foot)$
    opacity = 0.95 0.85
}

# Prevent Steam games from freezing on workspace switch
windowrule {
    name = steam-game-focus
    match:class = ^(steam_app_.*)$
    suppress_event = activate activatefocus
    render_unfocused = true
}

# Generic game windows (Wayland clients that set content type = game)
windowrule {
    name = generic-game-content
    match:content = 3
    render_unfocused = true
    idle_inhibit = focus
}

# Apply the same focus handling to gamescope windows
windowrule {
    name = gamescope-focus
    match:class = ^gamescope$
    render_unfocused = true
}

# Gaming quality-of-life: keep the system awake while gaming windows are active
windowrule {
    name = game-idle-inhibit
    match:class = ^(steam_app_.*|gamescope|lutris|heroic)$
    idle_inhibit = focus
}

# Idle inhibit for fullscreen media players
windowrule {
    name = media-idle-inhibit
    match:class = ^(mpv|vlc|firefox)$
    idle_inhibit = fullscreen
}

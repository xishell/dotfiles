[general]
default_module = "app"
empty_module = "a"
exec_cmd = "sh -c"
vi_mode = true
esc_to_abort = true
cheatsheet_entry = "?"
cheatsheet_viewer = "less -R; clear"
loop_mode = false

[interface]
header = """
 \u001B[38;2;122;162;247;1m  >\u001B[0m $USER@$(echo $HOSTNAME)        $(cat ~/.cache/wttr.txt 2>/dev/null)
    \u001B[38;2;122;162;247;1m>\u001B[0;1m """
list_prefix = "      "
selection_prefix = "    \u001B[38;2;122;162;247;1m> "
place_holder = "type and search"
default_module_message = "      \u001B[38;2;224;175;104msearch\u001B[0m the internet"
empty_module_message = ""
suggestion_mode = "list"
suggestion_lines = 12
indicator_with_arg_module = "\u001B[38;2;247;118;142m^\u001B[0m "
indicator_no_arg_module = "\u001B[38;2;247;118;142m$\u001B[0m "
prefix_padding = 3
prefix_color = "\u001B[38;2;224;175;104m"
description_color = "\u001B[38;2;169;177;214m"
place_holder_color = "\u001B[38;2;65;72;104m"
hint_color = "\u001B[38;2;65;72;104m"
move_right = 2
move_up = 0

# App launcher via fsel (default)
[[modules]]
prefix = "app"
description = "launch apps instantly"
cmd = "fsel -d -p {}"
with_argument = true

[[modules]]
prefix = "a"
description = "launch apps with fsel"
cmd = "fsel -d -ss \"{}\""
with_argument = true

[[modules]]
prefix = "s"
description = "run command in terminal"
cmd = "setsid -f alacritty -e {}"
with_argument = true

[[modules]]
prefix = "k"
description = "kill a running app"
cmd = 'ps -u "$USER" -o comm= | sort -u | fsel --dmenu | xargs -r pkill -9'
with_argument = true

[[modules]]
prefix = "p"
description = "power menu"
cmd = """
function power {
if [[ -n $1 ]]; then
case $1 in
"logout") hyprctl dispatch exit ;;
"suspend") systemctl suspend ;;
"lock") hyprlock ;;
"reboot") systemctl reboot ;;
"shutdown") systemctl poweroff ;;
esac fi }
power $(echo -e 'reboot\nshutdown\nlogout\nsuspend\nlock' | fzf --reverse --no-scrollbar --padding 1,3 --prompt 'Power Menu: ' | tail -1)
"""

[[modules]]
prefix = "gg"
description = "google search"
cmd = "setsid -f xdg-open 'https://www.google.com/search?q={}'"
with_argument = true
url_encode = true

[[modules]]
prefix = "w"
description = "search archwiki"
cmd = "setsid -f xdg-open 'https://wiki.archlinux.org/index.php?search={}'"
with_argument = true
url_encode = true

[[modules]]
prefix = "ch"
description = "cheatsheet (lang/query)"
cmd = "setsid -f alacritty --class cht-float -e ~/.local/bin/cht.sh --shell {}"
with_argument = true

[[modules]]
prefix = "cl"
description = "clipboard history"
cmd = "cliphist list | fzf --reverse --no-scrollbar | cliphist decode | wl-copy"
with_argument = false
